name: 'Cloudentity CAC'
description: 'Manage Cloudentity configuration as code'
inputs:
  args:
    description: 'Arguments to pass to cac'
    required: true
outputs:
  result:
    description: 'Result of the cac command'
    value: ${{ steps.run.outputs.result }}
runs:
  using: 'composite'
  steps:
    # github.action_ref is empty inside a composite action's run steps (and
    # leaks the ref of `uses:` steps like actions/cache), so we resolve the
    # release repo/tag ourselves.
    #
    # When the action is consumed remotely (uses: owner/repo@ref) github.action_path
    # is .../_actions/<owner>/<repo>/<ref>, so both repo and version come from it.
    # When it is used locally (uses: ./) github.action_path is just the checked-out
    # repo directory, so we fall back to the caller repo plus the checked-out tag
    # (github.ref_name is the workflow trigger ref, which is not the tag for
    # release-testing jobs, so prefer the exact tag git actually checked out).
    - name: Resolve action repo and version
      id: meta
      shell: bash
      run: |
        AP="${{ github.action_path }}"
        if [[ "$AP" == *"/_actions/"* ]]; then
          REST="${AP#*/_actions/}"
          OWNER="${REST%%/*}"; REST="${REST#*/}"
          NAME="${REST%%/*}"; REF="${REST#*/}"
          REPO="${OWNER}/${NAME}"
          VERSION="${REF}"
        else
          REPO="${{ github.repository }}"
          VERSION="$(git -C "$AP" describe --tags --exact-match 2>/dev/null || echo "${{ github.ref_name }}")"
        fi
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Restore cached binary
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /tmp/cac
        key: cac-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.version }}

    - name: Download pre-built binary
      id: download
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      continue-on-error: true
      run: |
        VERSION="${{ steps.meta.outputs.version }}"
        REPO="${{ steps.meta.outputs.repo }}"

        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
        esac
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        URL="https://github.com/${REPO}/releases/download/${VERSION}/cac_${OS}_${ARCH}.tar.gz"
        curl -sfL "$URL" -o /tmp/cac.tar.gz
        tar -xzf /tmp/cac.tar.gz -C /tmp cac
        chmod +x /tmp/cac
        echo "Downloaded pre-built binary from ${URL}"

    - name: Check for preinstalled Go
      id: go-check
      if: steps.download.outcome == 'failure'
      shell: bash
      run: |
        if command -v go > /dev/null; then
          echo "Using preinstalled Go: $(go version)"
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Go
      if: steps.download.outcome == 'failure' && steps.go-check.outputs.preinstalled != 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: '${{ github.action_path }}/go.mod'

    - name: Build from source
      if: steps.download.outcome == 'failure'
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        CGO_ENABLED=0 go build -o /tmp/cac .
        echo "Built from source (no pre-built binary available for this ref)"

    - name: Run cac
      id: run
      shell: bash
      run: |
        /tmp/cac ${{ inputs.args }} > /tmp/out
        content=$(awk '{printf "%s\\n", $0}' /tmp/out)
        echo "result=$content" >> "$GITHUB_OUTPUT"
